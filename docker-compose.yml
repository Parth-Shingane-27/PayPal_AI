name: globalcart

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: globalcart
      POSTGRES_PASSWORD: globalcart
      POSTGRES_DB: globalcart
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globalcart -d globalcart && psql -U globalcart -d globalcart_test -c 'select 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
